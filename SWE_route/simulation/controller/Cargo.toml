[package]
name = "lamp-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
default-run = "lamp-controller"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
cpu-time = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
